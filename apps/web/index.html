<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal OS review, search, and timeline console" />
    <meta name="theme-color" content="#11130f" />
    <title>Personal OS</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/app.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#main" aria-label="Personal OS ホーム">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <strong>Personal OS</strong>
        </a>

        <nav class="primary-nav" aria-label="メインメニュー">
          <button class="tab active" data-view="review" aria-controls="review-view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 11l2 2 4-4M5 4h14v16H5z" />
            </svg>
            <span>レビュー</span><b id="nav-pending-count">—</b>
          </button>
          <button class="tab" data-view="search" aria-controls="search-view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.3" />
              <path d="m16 16 4 4" />
            </svg>
            <span>検索</span>
          </button>
          <button class="tab" data-view="timeline" aria-controls="timeline-view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 7v5l3 2M4 12a8 8 0 1 0 2.3-5.7L4 8.6V4" />
            </svg>
            <span>タイムライン</span>
          </button>
          <button class="tab" data-view="state" aria-controls="state-view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
            <span>現在の状態</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <details class="connection-panel">
            <summary>
              <span class="connection-dot"></span>
              <strong>API 設定</strong>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
            </summary>
            <form id="connection-form" class="connection-form">
              <sl-input
                id="api-base"
                name="apiBase"
                type="url"
                size="small"
                label="API endpoint"
                placeholder="Same origin"
              ></sl-input>
              <sl-input
                id="access-token"
                name="accessToken"
                type="password"
                size="small"
                autocomplete="off"
                label="Cognito access token"
                placeholder="Bearer token"
                password-toggle
              ></sl-input>
              <p>トークンはこのタブを閉じると破棄されます。</p>
              <sl-button type="submit" size="small" variant="primary">接続を更新</sl-button>
            </form>
          </details>
          <p class="build-label">v1.0.0-rc.1</p>
        </div>
      </aside>

      <main id="main" class="main-content" tabindex="-1">
        <header class="topbar">
          <div>
            <h1>おかえりなさい</h1>
          </div>
          <div id="health" class="health" role="status">
            <span class="health-dot"></span><span>接続を確認中</span>
          </div>
        </header>


        <section class="status-grid" aria-label="概要">
          <article class="status-card status-card--primary">
            <div class="status-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 11l2 2 4-4M5 4h14v16H5z" />
              </svg>
            </div>
            <div><span>要レビュー</span><strong id="pending-count">—</strong></div>
          </article>
          <article class="status-card">
            <div class="status-icon status-icon--muted">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 7v5l3 2M4 12a8 8 0 1 0 2.3-5.7L4 8.6V4" />
              </svg>
            </div>
            <div><span>監査イベント</span><strong id="timeline-count">—</strong></div>
          </article>
          <article class="status-card">
            <div class="status-icon status-icon--muted">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
            </div>
            <div><span>有効な記憶</span><strong id="memory-count">—</strong></div>
          </article>
        </section>

        <section id="review-view" class="view" aria-labelledby="review-title">
          <div class="section-heading">
            <div>
              <h2 id="review-title" tabindex="-1">
                審査待ちの提案
                <sl-badge id="inbox-count" class="inbox-count" variant="primary" pill>—</sl-badge>
              </h2>
            </div>
            <sl-button size="small" class="icon-button" data-refresh="review">
              <svg slot="prefix" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.8-2L20 11M4 13l2.1 4a7 7 0 0 0 11.8-2"
                />
              </svg>
              更新
            </sl-button>
          </div>
          <p id="review-shortcuts" class="shortcut-hint" hidden>
            <span><kbd>J</kbd><kbd>K</kbd> で移動</span><span><kbd>A</kbd> で承認</span
            ><span><kbd>R</kbd> で却下</span><span><kbd>Esc</kbd> で取り消し</span>
          </p>
          <div id="proposal-list" class="review-list" aria-live="polite">
            <div class="empty-state">
              <div>
                <span class="empty-state-icon"
                  ><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 4h14v16H5zM9 9h6M9 13h4" /></svg
                ></span>
                <h3>API に接続してください</h3>
                <p>「API 設定」から接続します。</p>
              </div>
            </div>
          </div>
        </section>

        <section id="search-view" class="view hidden" aria-labelledby="search-title">
          <div class="section-heading">
            <div>
              <h2 id="search-title">記憶を検索</h2>
            </div>
          </div>
          <form id="search-form" class="search-panel">
            <label for="query">質問またはキーワード</label>
            <div class="search-input-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.3" />
                <path d="m16 16 4 4" />
              </svg>
              <input
                id="query"
                name="query"
                required
                placeholder="例：いま優先している研究テーマは？"
              />
              <button type="submit">検索</button>
            </div>
            <fieldset>
              <legend>検索に含めるプライバシークラス</legend>
              <label
                ><input type="checkbox" name="privacy" value="P0" checked /><span
                  >P0 公開</span
                ></label
              ><label
                ><input type="checkbox" name="privacy" value="P1" checked /><span
                  >P1 個人</span
                ></label
              ><label><input type="checkbox" name="privacy" value="P2" /><span>P2 機微</span></label
              ><label
                ><input type="checkbox" name="privacy" value="P3" /><span>P3 厳格</span></label
              >
            </fieldset>
          </form>
          <div id="search-results" class="result-list" aria-live="polite"></div>
        </section>

        <section id="timeline-view" class="view hidden" aria-labelledby="timeline-title">
          <div class="section-heading">
            <div>
              <h2 id="timeline-title">監査タイムライン</h2>
            </div>
            <sl-button size="small" class="icon-button" data-refresh="timeline">
              <svg slot="prefix" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.8-2L20 11M4 13l2.1 4a7 7 0 0 0 11.8-2"
                /></svg
              >更新
            </sl-button>
          </div>
          <ol id="timeline-list" class="timeline" aria-live="polite">
            <li>
              <div><strong>接続待ち</strong></div>
            </li>
          </ol>
        </section>

        <section id="state-view" class="view hidden" aria-labelledby="state-title">
          <div class="section-heading">
            <div>
              <h2 id="state-title">現在の状態</h2>
            </div>
            <sl-button size="small" class="icon-button" data-refresh="state">
              <svg slot="prefix" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.8-2L20 11M4 13l2.1 4a7 7 0 0 0 11.8-2"
                /></svg
              >更新
            </sl-button>
          </div>
          <div id="state-content" class="state-grid" aria-live="polite">
            <section class="state-group">
              <h3>接続待ち</h3>
            </section>
          </div>
        </section>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
